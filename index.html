<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Expense Tracker</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #f5f7fb;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    input, select {
      padding: 8px;
      margin: 5px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      padding: 8px 14px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #3e9142;
    }

    .metrics {
      display: flex;
      gap: 10px;
    }

    .metric-box {
      flex: 1;
      background: #eef2f7;
      padding: 12px;
      border-radius: 10px;
      text-align: center;
    }

    canvas {
      max-width: 350px;
      margin: auto;
      display: block;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      padding: 8px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    th {
      background: #f0f3f8;
    }
  </style>
</head>

<body>

<div class="container">

<h2>💸 Expense Tracker Dashboard</h2>

<!-- INPUT -->
<div class="card">
  <input id="amount" type="number" placeholder="Amount">

  <select id="category">
    <option>Food</option>
    <option>Travel</option>
    <option>Shopping</option>
    <option>Bills</option>
    <option>Entertainment</option>
    <option>Health</option>
    <option>Education</option>
    <option>Groceries</option>
    <option>Rent</option>
    <option>Utilities</option>
    <option>Other</option>
  </select>

  <input id="date" type="date">
  <input id="note" placeholder="Note">

  <button onclick="addExpense()">Add</button>
</div>

<!-- METRICS -->
<div class="card">
  <div class="metrics">
    <div class="metric-box">
      <div>Total</div>
      <strong id="total">₹0</strong>
    </div>

    <div class="metric-box">
      <div>Average</div>
      <strong id="avg">₹0</strong>
    </div>

    <div class="metric-box">
      <div>Entries</div>
      <strong id="count">0</strong>
    </div>
  </div>

  <p id="top"></p>
</div>

<div class="grid">

  <!-- PIE -->
  <div class="card">
    <h3>Spending by Category</h3>
    <canvas id="pieChart"></canvas>
  </div>

  <!-- LINE -->
  <div class="card">
    <h3>Spending Over Time</h3>
    <canvas id="lineChart"></canvas>
  </div>

</div>

<!-- TABLE -->
<div class="card">
  <h3>Transaction History</h3>
  <table id="table">
    <thead>
      <tr>
        <th>Category</th>
        <th>Amount</th>
        <th>Date</th>
        <th>Note</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

</div>

<script>
const API_ADD = "https://g25gixqk40.execute-api.ap-southeast-2.amazonaws.com/dev/add";
const API_GET = "https://g25gixqk40.execute-api.ap-southeast-2.amazonaws.com/dev/get";

let pieChart, lineChart;

document.getElementById("date").valueAsDate = new Date();

async function addExpense() {
  await fetch(API_ADD, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      amount: document.getElementById("amount").value,
      category: document.getElementById("category").value,
      date: document.getElementById("date").value,
      note: document.getElementById("note").value
    })
  });

  loadData();
}

async function loadData() {
  const res = await fetch(API_GET);
  const data = await res.json();

  const items = data.items || [];
  const total = data.total || 0;
  const avg = items.length ? (total / items.length).toFixed(2) : 0;

  document.getElementById("total").innerText = "₹" + total;
  document.getElementById("avg").innerText = "₹" + avg;
  document.getElementById("count").innerText = items.length;
  document.getElementById("top").innerText =
    "Top Category: " + (data.highestCategory || "N/A");

  renderPie(data.categoryMap || {});
  renderLine(items);
  renderTable(items);
}

function renderPie(map) {
  const ctx = document.getElementById("pieChart");

  if (pieChart) pieChart.destroy();

  const labels = Object.keys(map);
  const values = Object.values(map);

  const colors = [
    '#FF6384', '#36A2EB', '#FFCE56',
    '#4BC0C0', '#9966FF', '#FF9F40',
    '#8AC926', '#1982C4', '#6A4C93',
    '#FF595E', '#00A896'
  ];

  pieChart = new Chart(ctx, {
    type: "pie",
    data: {
      labels: labels,
      datasets: [{
        data: values,
        backgroundColor: colors.slice(0, labels.length)
      }]
    }
  });
}

function renderLine(items) {
  const daily = {};

  items.forEach(i => {
    daily[i.date] = (daily[i.date] || 0) + i.amount;
  });

  const ctx = document.getElementById("lineChart");

  if (lineChart) lineChart.destroy();

  lineChart = new Chart(ctx, {
    type: "line",
    data: {
      labels: Object.keys(daily),
      datasets: [{
        label: "Daily Spending",
        data: Object.values(daily),
        borderColor: "#4CAF50",
        fill: false
      }]
    }
  });
}

function renderTable(items) {
  const tbody = document.querySelector("#table tbody");
  tbody.innerHTML = "";

  items.forEach(i => {
    tbody.innerHTML += `
      <tr>
        <td>${i.category}</td>
        <td>₹${i.amount}</td>
        <td>${i.date}</td>
        <td>${i.note || "-"}</td>
      </tr>
    `;
  });
}

loadData();
</script>

</body>
</html>
